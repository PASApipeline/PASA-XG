[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pasa-xg"
version = "0.1.0.dev0"
description = "PASA-XG: transcript-evidence genome annotation across sequencing generations"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
dependencies = ["pysam>=0.21", "pandas>=1.5", "pyarrow>=10"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pasa-xg = "pasa_xg.cli:main"

[tool.setuptools.packages.find]
include = ["pasa_xg*"]
